# Preview the site on GitHub Pages (free github.io address) before anything goes to FTP.
# One-time setup: Settings > Pages > Source = "GitHub Actions".
# If a deploy is rejected, add the branch under Settings > Environments > github-pages > Deployment branches.
name: Pages preview

on:
  push:
    branches: [staging, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (noindex)
        run: .github/scripts/build.sh staging
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
